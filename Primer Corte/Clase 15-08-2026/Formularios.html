<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulario &lt6. &amp; Formularios &gt; &quot;</h1>
    <section id="formularios">
        <form action="/registro.php" method="post">
            <fieldset>
                <legend>Datos Personales</legend>

                <div>
                    <label for="nombre">Nombre:</label>
                    <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    placeholder="Nombre" 
                    required
                    />
                </div>
                
                <p>
                    <label for="correo">Correo:</label>
                    <input 
                    type="email" 
                    id="correo" 
                    name="correo" 
                    />
                </p>

                <p>
                    <label for="clave">Contraseña:</label>
                    <input 
                    type="password" 
                    id="clave" 
                    name="Clave"
                    />
                </p>

                <p>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="1" max="120" />
                </p>

                <p>
                    <label for="fecha">Fecha de nacimiento:</label>
                    <input type="date" id="fecha" name="fecha" />
                </p>

                <p>
                    <label for="color">Color favorito:</label>
                    <input type="color" id="color" name="color" value="#FFFFFFF"/>
                </p>

                <p>
                    <label for="rango">Nivel (1 a 10):</label>
                    <input type="range" id="rango" name="rango" min="1" max="10" />
                </p>
            </fieldset>

            <fieldset> 
                <legend>Preferencias</legend>

                <label for="curso">Curso:</label>
                <select name="curso" id="curso" placeholder="Seleccione un curso" required>
                    <option value="1">Curso 1</option>
                    <option value="2">Curso 2</option>
                    <option value="3">Curso 3</option>
                </select>

                <p>
                    <label for="jornada">Jornada:</label>
                    <input type="radio" name="jornada" value="mañana" /> Mañana
                    <input type="radio" name="jornada" value="tarde" /> Tarde
                    <input type="radio" name="jornada" value="noche" /> Noche
                </p>
            </fieldset>
    </section>
</body>
</html>
