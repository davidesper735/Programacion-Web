<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1.7 Crear e insertar nodos</title>
  <link rel="stylesheet" href="../../assets/demo.css">
  <script src="../../assets/demo.js" defer></script>
  <script src="07-crear.js" defer></script>
  <style>
    #lista li { padding: 2px 6px; border-radius: 4px; }
    #lista li.referencia { outline: 2px dashed var(--accent); }
    .nuevo { animation: aparecer 1.2s; }
    @keyframes aparecer { from { background: var(--warn); color: #fff; } }
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .tarjeta { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); }
    .tarjeta h3 { margin: 0 0 4px; font-size: 1rem; }
    .tarjeta p { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; word-break: break-all; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: bold; }
    #masivo { max-height: 120px; overflow: auto; font-size: 0.75rem; }
  </style>
</head>
<body>
<main>
  <h1>1.7 Crear, insertar y eliminar nodos</h1>

  <h2>1. Posiciones de inserción</h2>
  <p class="hint">Haz clic en un elemento de la lista para elegirlo como referencia (recuadro discontinuo).</p>
  <div class="panel">
    <ul id="lista">
      <li>Uno</li>
      <li class="referencia">Dos</li>
      <li>Tres</li>
    </ul>
  </div>
  <div class="row">
    <button data-metodo="before">ref.before(nuevo)</button>
    <button data-metodo="after">ref.after(nuevo)</button>
    <button data-metodo="prepend">lista.prepend(nuevo)</button>
    <button data-metodo="append">lista.append(nuevo)</button>
    <button data-metodo="replaceWith">ref.replaceWith(nuevo)</button>
  </div>
  <div class="row" style="margin-top: 8px">
    <button class="secondary" id="btn-mover">Mover la primera al final</button>
    <button class="secondary" id="btn-clonar">Clonar la referencia</button>
    <button class="secondary" id="btn-eliminar">ref.remove()</button>
    <button class="secondary" id="btn-reset">Restaurar</button>
  </div>

  <h2>2. Plantillas con <code>&lt;template&gt;</code></h2>
  <template id="tpl-tarjeta">
    <article class="tarjeta">
      <div class="avatar"></div>
      <h3 class="nombre"></h3>
      <p class="email"></p>
      <button class="secondary borrar">Borrar</button>
    </article>
  </template>
  <div class="row">
    <button id="btn-tarjetas">Pintar tarjetas desde datos</button>
  </div>
  <div class="tarjetas" id="tarjetas"></div>

  <h2>3. Rendimiento</h2>
  <div class="row">
    <button id="btn-uno-a-uno" class="secondary">2000 × append (uno a uno)</button>
    <button id="btn-fragmento" class="secondary">DocumentFragment + 1 append</button>
  </div>
  <div class="panel" id="masivo"></div>

  <h2>Registro</h2>
  <pre class="log"></pre>
</main>
</body>
</html>
