<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2.1 addEventListener</title>
  <link rel="stylesheet" href="../../assets/demo.css">
  <script src="../../assets/demo.js" defer></script>
  <script src="01-listeners.js" defer></script>
  <style>
    #rastreador { height: 120px; display: grid; place-items: center; border: 2px dashed var(--border); border-radius: 10px; user-select: none; }
  </style>
</head>
<body>
<main>
  <h1>2.1 Escuchar eventos</h1>

  <h2>1. <code>onclick</code> frente a <code>addEventListener</code></h2>
  <div class="row">
    <button id="btn-a">A: dos onclick</button>
    <button id="btn-b">B: dos addEventListener</button>
  </div>

  <h2>2. <code>removeEventListener</code></h2>
  <div class="row">
    <button id="btn-objetivo">Botón objetivo</button>
    <button id="btn-quitar" class="secondary">Quitar listener (constante)</button>
    <button id="btn-poner" class="secondary">Volver a poner</button>
    <button id="btn-quitar-anonimo" class="secondary">Quitar listener (función anónima)</button>
  </div>

  <h2>3. <code>once</code></h2>
  <button id="btn-once">Solo respondo una vez</button>

  <h2>4. <code>AbortController</code>: quitar varios de golpe</h2>
  <div class="panel" id="rastreador">Mueve el ratón aquí, haz clic o pulsa una tecla</div>
  <div class="row">
    <button id="btn-parar" class="secondary">Parar todo (controlador.abort())</button>
    <button id="btn-reanudar" class="secondary">Reanudar</button>
  </div>

  <h2>Registro</h2>
  <div class="row"><button class="secondary" id="btn-limpiar">Limpiar</button></div>
  <pre class="log"></pre>
</main>
</body>
</html>
